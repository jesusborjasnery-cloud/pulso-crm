    return [
      { texto: 'Nueva oportunidad', der: 'N', run: () => nuevaOportunidad() },
      { texto: 'Ir a Inicio', run: () => ir('inicio') },
      { texto: 'Ir a Pipeline', run: () => ir('pipeline') },
      { texto: 'Ir a Tabla', run: () => ir('tabla') },
      { texto: 'Exportar respaldo', run: exportar },
      { texto: 'Importar respaldo', run: importar },
      { texto: 'Cambiar tema', der: { auto: 'Automático', oscuro: 'Oscuro', claro: 'Claro' }[ajustes.tema], run: () => cambiarTema(ajustes.tema === 'oscuro' ? 'claro' : ajustes.tema === 'claro' ? 'auto' : 'oscuro') },
      { texto: 'Ajustes', run: abrirAjustes }
    ];
  }
  function normalizar(s) { return String(s).toLocaleLowerCase('es').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function abrirPaleta() {
    const p = $('#paleta');
    if (p.open) return;
    if ($('#dialogo').open) return;
    focoAntesPaleta = document.activeElement;
    $('#paleta-input').value = '';
    renderPaleta();
    p.showModal();
    $('#paleta-input').focus();
  }
  function cerrarPaleta() { const p = $('#paleta'); if (p.open) p.close(); }
  $('#paleta').addEventListener('close', () => {
    if (focoAntesPaleta && document.contains(focoAntesPaleta)) focoAntesPaleta.focus();
    focoAntesPaleta = null;
  });
  function renderPaleta() {
    const q = normalizar($('#paleta-input').value.trim());
    const grupos = [];
    const ops = datos.oportunidades.filter(o => !q || normalizar(o.nombre).includes(q) || normalizar(o.cliente).includes(q))
      .slice(0, q ? 8 : 5)
      .map(o => ({ texto: o.cliente + ' — ' + o.nombre, der: clp(o.monto) + ' · ' + ETAPA[o.etapa].nombre, run: () => abrirFicha(o.id) }));
    if (ops.length) grupos.push(['Oportunidades', ops]);
    if (q) {
      const clientes = [...new Set(datos.oportunidades.map(o => o.cliente))].filter(c => normalizar(c).includes(q)).slice(0, 5)
        .map(c => ({ texto: c, der: datos.oportunidades.filter(o => o.cliente === c).length + ' en la tabla', run: () => { filtros.texto = c; filtros.tipo = ''; filtros.etapa = ''; filtros.riesgo = false; if (vistaActual() === 'tabla') { $('#vista').innerHTML = ''; render(); } else ir('tabla'); } }));
      if (clientes.length) grupos.push(['Clientes', clientes]);
    }
    const acc = accionesPaleta().filter(a => !q || normalizar(a.texto).includes(q));
    if (acc.length) grupos.push(['Acciones', acc]);
    if (!grupos.length) {
      const texto = $('#paleta-input').value.trim();
      grupos.push(['Sin resultados para "' + texto + '"', [{ texto: 'Crear oportunidad "' + texto + '"', der: 'Enter', run: () => nuevaOportunidad(texto) }]]);
    }
    paletaItems = [];
    let html = '';
    grupos.forEach(([titulo, items], gi) => {
      html += '<div class="paleta-grupo etiqueta" role="presentation" id="pg-' + gi + '">' + esc(titulo) + '</div><div role="group" aria-labelledby="pg-' + gi + '">';
      items.forEach(it => {
        const i = paletaItems.length;
        paletaItems.push(it);
        html += '<div class="paleta-item" role="option" id="pi-' + i + '" data-i="' + i + '" aria-selected="false"><span title="' + esc(it.texto) + '">' + esc(it.texto) + '</span>' + (it.der ? '<span class="der">' + esc(it.der) + '</span>' : '') + '</div>';
      });
      html += '</div>';
    });
    $('#paleta-lista').innerHTML = html;
    seleccionarPaleta(0);
  }
  function seleccionarPaleta(i) {
    if (!paletaItems.length) return;
    paletaSel = (i + paletaItems.length) % paletaItems.length;
    $$('.paleta-item').forEach(el => el.setAttribute('aria-selected', String(Number(el.dataset.i) === paletaSel)));
    const el = $('#pi-' + paletaSel);
    $('#paleta-input').setAttribute('aria-activedescendant', 'pi-' + paletaSel);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
  function ejecutarPaleta(i) {
    const it = paletaItems[i];
    if (!it) return;
    focoAntesPaleta = null;
    cerrarPaleta();
    it.run();
  }
  $('#paleta-input').addEventListener('input', renderPaleta);
  $('#paleta-input').addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); seleccionarPaleta(paletaSel + 1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); seleccionarPaleta(paletaSel - 1); }
    else if (ev.key === 'Enter') { ev.preventDefault(); ejecutarPaleta(paletaSel); }
  });
  $('#paleta-lista').addEventListener('click', ev => {
    const el = ev.target.closest('.paleta-item');
    if (el) ejecutarPaleta(Number(el.dataset.i));
  });
  $('#paleta-lista').addEventListener('mousemove', ev => {
    const el = ev.target.closest('.paleta-item');
    if (el && Number(el.dataset.i) !== paletaSel) seleccionarPaleta(Number(el.dataset.i));
  });
  $('#paleta').addEventListener('click', ev => { if (ev.target === $('#paleta')) cerrarPaleta(); });

  /* =======================================================
     EVENTOS GLOBALES
     ======================================================= */
  window.addEventListener('hashchange', () => { render(); $('#vista').focus({ preventScroll: true }); });
  $('#btn-nueva').addEventListener('click', () => nuevaOportunidad());
  $('#btn-paleta').addEventListener('click', abrirPaleta);
  $('#btn-ajustes').addEventListener('click', abrirAjustes);
  $('#aviso-cerrar').addEventListener('click', ocultarAviso);

  function esCampoEditable(el) {
    return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  }
  document.addEventListener('keydown', ev => {
    const mod = esMac ? ev.metaKey : ev.ctrlKey;
    if (mod && !ev.altKey && !ev.shiftKey && (ev.key || '').toLowerCase() === 'k') {
      ev.preventDefault();
      if ($('#paleta').open) cerrarPaleta(); else abrirPaleta();
      return;
    }
    if ($('#paleta').open || $('#dialogo').open) return;
    if (ev.key === 'Escape' && fichaId) { ev.preventDefault(); cerrarFicha(); return; }
    if (esCampoEditable(ev.target)) return;
    if ((ev.key === 'n' || ev.key === 'N') && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      ev.preventDefault(); nuevaOportunidad(); return;
    }
    const abrible = ev.target.closest && ev.target.closest('[data-abrir]');
    if (abrible && (ev.key === 'Enter' || ev.key === ' ') && ev.target === abrible) {
      ev.preventDefault(); abrirFicha(abrible.dataset.id); return;
    }
    const tarjetaEl = ev.target.closest && ev.target.closest('.tarjeta');
    if (tarjetaEl && ev.altKey && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
      ev.preventDefault();
      const o = buscar(tarjetaEl.dataset.id);
      const i = ETAPAS.findIndex(e => e.id === o.etapa) + (ev.key === 'ArrowRight' ? 1 : -1);
      if (i >= 0 && i < ETAPAS.length) moverA(o.id, ETAPAS[i].id, () => { const t = $('#vista [data-id="' + o.id + '"]'); if (t) t.focus(); });
    }
  });

  /* Clics dentro de las vistas */
  $('#vista').addEventListener('click', ev => {
    const orden = ev.target.closest('[data-orden]');
    if (orden) {
      const c = orden.dataset.orden;
      if (filtros.orden === c) filtros.dir *= -1; else { filtros.orden = c; filtros.dir = COLUMNAS.find(x => x.id === c).num ? -1 : 1; }
      renderTabla();
      const b = $('[data-orden="' + c + '"]'); if (b) b.focus();
      return;
    }
    const acc = ev.target.closest('[data-accion="nueva"]');
    if (acc) { nuevaOportunidad(); return; }
    const abrible = ev.target.closest('[data-abrir]');
    if (abrible) abrirFicha(abrible.dataset.id);
  });
  $('#vista').addEventListener('input', ev => {
    if (ev.target.id === 'tabla-buscar') { filtros.texto = ev.target.value; renderTabla(); }
  });
  $('#vista').addEventListener('change', ev => {
    if (ev.target.id === 'tabla-tipo') filtros.tipo = ev.target.value;
    else if (ev.target.id === 'tabla-etapa') filtros.etapa = ev.target.value;
    else if (ev.target.id === 'tabla-riesgo') filtros.riesgo = ev.target.checked;
    else return;
    renderTabla();
  });

  /* Arrastrar y soltar en el pipeline */
  let arrastrandoId = null;
  $('#vista').addEventListener('dragstart', ev => {
    const t = ev.target.closest && ev.target.closest('.tarjeta');
    if (!t) return;
    arrastrandoId = t.dataset.id;
    t.classList.add('arrastrando');
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', arrastrandoId);
  });
  $('#vista').addEventListener('dragend', ev => {
    const t = ev.target.closest && ev.target.closest('.tarjeta');
    if (t) t.classList.remove('arrastrando');
    $$('.columna.destino').forEach(c => c.classList.remove('destino'));
    arrastrandoId = null;
  });
  $('#vista').addEventListener('dragover', ev => {
    const col = ev.target.closest && ev.target.closest('.columna');
    if (!col || !arrastrandoId) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    $$('.columna.destino').forEach(c => { if (c !== col) c.classList.remove('destino'); });
    col.classList.add('destino');
  });
  $('#vista').addEventListener('dragleave', ev => {
    const col = ev.target.closest && ev.target.closest('.columna');
    if (col && !col.contains(ev.relatedTarget)) col.classList.remove('destino');
  });
  $('#vista').addEventListener('drop', ev => {
    const col = ev.target.closest && ev.target.closest('.columna');
    if (!col) return;
    ev.preventDefault();
    const id = ev.dataTransfer.getData('text/plain') || arrastrandoId;
    col.classList.remove('destino');
    arrastrandoId = null;
    if (id) moverA(id, col.dataset.etapa);
  });

  /* Ficha: cerrar, editar, acciones */
  $('#ficha').addEventListener('click', ev => {
    if (ev.target.closest('#ficha-cerrar')) { cerrarFicha(); return; }
    const b = ev.target.closest('[data-accion]');
    if (!b) return;
    const o = buscar(fichaId);
    if (!o) return;
    const a = b.dataset.accion;
    if (a === 'ganar') { moverA(o.id, 'ganada', ok => { if (ok) { mostrarGuardado(); avisar('Oportunidad marcada como ganada.', 'ok'); } }); }
    else if (a === 'perder') { moverA(o.id, 'perdida', ok => { if (ok) mostrarGuardado(); }); }
    else if (a === 'reabrir') { moverA(o.id, 'negociacion', ok => { if (ok) { mostrarGuardado(); avisar('Oportunidad reabierta en Negociación.', 'ok'); } }); }
    else if (a === 'eliminar') eliminar(o);
  });
  $('#ficha').addEventListener('change', ev => {
    if (ev.target.dataset && ev.target.dataset.campo) guardarCampo(ev.target);
  });
  $('#ficha').addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.campo && ev.target.tagName === 'INPUT') {
      ev.preventDefault(); ev.target.blur();
    }
  });
  $('#ficha').addEventListener('submit', ev => {
    if (ev.target.id === 'form-actividad') { ev.preventDefault(); registrarActividad(); }
  });

  /* =======================================================
     PRUEBAS RÁPIDAS (T-004) — Pulso.pruebas() en la consola
     ======================================================= */
  function pruebas() {
    const h = hoy();
    const base = { etapa: 'propuesta', monto: 1000000, creada: sumarDias(h, -40), actividades: [], cierre: sumarDias(h, 30) };
    const casos = [
      ['1250000 → $1.250.000', clp(1250000).replace(/\u00a0/g, ' ') === '$1.250.000'],
      ['12500000 abreviado → $12,5 M', clpCorto(12500000).replace(/\u00a0/g, ' ') === '$12,5 M'],
      ['RUT 11.111.111-1 válido', rutValido('11.111.111-1')],
      ['RUT 11.111.111-2 no válido', !rutValido('11.111.111-2')],
      ['Negociación → 75 %', probabilidad({ etapa: 'negociacion' }) === 75],
      ['15 días sin actividad → en riesgo', enRiesgo(Object.assign({}, base, { actividades: [{ id: 'x', fecha: sumarDias(h, -15), texto: '' }] }))],
      ['14 días sin actividad → sin riesgo', !enRiesgo(Object.assign({}, base, { actividades: [{ id: 'x', fecha: sumarDias(h, -14), texto: '' }] }))],
      ['Cierre ayer → en riesgo', enRiesgo(Object.assign({}, base, { actividades: [{ id: 'x', fecha: h, texto: '' }], cierre: sumarDias(h, -1) }))],
      ['Ganada nunca en riesgo', !enRiesgo(Object.assign({}, base, { etapa: 'ganada', cierre: sumarDias(h, -10) }))],
      ['Fecha → dd-mm-aaaa', fecha('2026-03-05') === '05-03-2026'],
      ['Monto -5 no válido', leerMonto('-5') === null],
      ['Monto 1.250.000 válido', leerMonto('1.250.000') === 1250000]
    ];
    casos.forEach(([n, ok]) => console.log((ok ? 'OK   ' : 'FALLA') + ' ' + n));
    const todo = casos.every(c => c[1]);
    console.log(todo ? 'OK: todas las pruebas pasaron' : 'FALLA: revisa los casos marcados');
    return todo;
  }

  /* =======================================================
     INICIO
     ======================================================= */
  $('#atajo-paleta').textContent = esMac ? '⌘K' : 'Ctrl K';
  cargar();
  aplicarTema();
  if (!VISTAS.includes(location.hash.replace('#', ''))) {
    try { history.replaceState(null, '', '#inicio'); } catch (e) { /* file:// en algunos navegadores */ }
  }
  render();

  window.Pulso = {
    pruebas,
    _interno: { hoy, enRiesgo, ponderado, probabilidad, ultimaActividad, rutValido, clp, clpCorto, fecha, datos: () => datos, cantidadRiesgo, pipelinePonderado, pronosticoMes, ganadoMes, seguimientoHoy }
  };
})();
</script>
